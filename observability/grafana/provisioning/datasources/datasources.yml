apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      # Deja que Grafana lea (solo lectura: Prometheus no soporta ruler API de
      # escritura) las 19 reglas de alerts.yml y las muestre en Alerting >
      # Alert rules. Sin esto la sección de alertas de Grafana aparece vacía
      # aunque Prometheus las esté evaluando correctamente.
      manageAlerts: true
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Convierte el request_id de cada línea en un botón que trae todas las
      # demás líneas de esa misma petición: la de acceso y, si reventó, la del
      # stack trace.
      derivedFields:
        - name: request_id
          matcherType: regex
          matcherRegex: '"request_id":"([^"]+)"'
          datasourceUid: loki
          query: '{container=~"dermicapro-backend.*"} |= "$${__value.raw}"'
          urlDisplayLabel: 'Ver la petición completa'
    editable: false

  # Tabla leads_grafana, que vive en la Postgres de otro VPS. Es la única fuente
  # de este stack que se consulta con SQL en vez de con PromQL: no son series
  # temporales que alguien exporte, son filas de agenda que ya están escritas.
  # El usuario debe ser de sólo lectura y con SELECT únicamente sobre esa tabla:
  # cualquier persona con acceso a Grafana puede escribir SQL arbitrario contra
  # este datasource desde Explore.
  - name: Leads
    type: grafana-postgresql-datasource
    uid: leads
    url: ${LEADS_DB_HOST}:${LEADS_DB_PORT}
    user: ${LEADS_DB_USER}
    jsonData:
      database: ${LEADS_DB_NAME}
      # Va por internet entre dos VPS, así que TLS no es opcional.
      sslmode: ${LEADS_DB_SSLMODE}
      postgresVersion: 1400
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: ${LEADS_DB_PASSWORD}
    editable: false

  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
    editable: false
