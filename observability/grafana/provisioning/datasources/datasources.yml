apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      # Deja que Grafana lea (solo lectura: Prometheus no soporta ruler API de
      # escritura) las 19 reglas de alerts.yml y las muestre en Alerting >
      # Alert rules. Sin esto la sección de alertas de Grafana aparece vacía
      # aunque Prometheus las esté evaluando correctamente.
      manageAlerts: true
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Convierte el request_id de cada línea en un botón que trae todas las
      # demás líneas de esa misma petición: la de acceso y, si reventó, la del
      # stack trace.
      derivedFields:
        - name: request_id
          matcherType: regex
          matcherRegex: '"request_id":"([^"]+)"'
          datasourceUid: loki
          query: '{container=~"dermicapro-backend.*"} |= "$${__value.raw}"'
          urlDisplayLabel: 'Ver la petición completa'
    editable: false

  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
    editable: false
