# ================================
# Prometheus - Recolección de métricas
# ================================
# Este Prometheus sólo scrapea servicios de ESTE VPS (el del ERP). El CRM tiene
# su propio stack independiente en el otro VPS: no hay ingesta remota ni
# endpoints públicos entre ambos, de modo que el monitoreo de cada sistema
# sobrevive a que el otro se caiga.
#
# La etiqueta system="erp" viaja en cada alerta hasta n8n, que así puede
# etiquetar el aviso sin depender de por qué webhook entró.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    env: production

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # ================================
  # Backend de DermicaPro (ERP)
  # ================================
  # Se usa service discovery de Docker en vez de targets estáticos porque el
  # deploy es blue-green: sólo un color está levantado la mayor parte del tiempo
  # y con targets fijos el color apagado dispararía "BackendCaido" en falso.
  - job_name: dermicapro-backend
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Acepta tanto los nombres blue-green de producción
      # (dermicapro-backend-blue) como el de desarrollo (dermicapro-backend).
      - source_labels: [__meta_docker_container_name]
        regex: "/dermicapro-backend(-.*)?"
        action: keep
      # Cada contenedor genera un target por puerto expuesto y por red; nos
      # quedamos sólo con el puerto de la API para no duplicar series.
      - source_labels: [__meta_docker_port_private]
        regex: "5000"
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: "/dermicapro-backend-(.*)"
        target_label: color
        replacement: "$1"
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: instance
        replacement: "$1"
      - target_label: system
        replacement: erp
      - target_label: host
        replacement: vps-erp

  # ================================
  # Infraestructura de este VPS
  # ================================
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels: { system: erp, host: vps-erp }

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels: { system: erp, host: vps-erp }

  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels: { system: erp, host: vps-erp }

  - job_name: traefik
    static_configs:
      - targets: ['traefik:8082']
        labels: { system: erp, host: vps-erp }

  # ================================
  # El propio stack de observabilidad
  # ================================
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels: { system: erp, host: vps-erp }

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels: { system: erp, host: vps-erp }

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ['alloy:12345']
        labels: { system: erp, host: vps-erp }

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
        labels: { system: erp, host: vps-erp }

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
        labels: { system: erp, host: vps-erp }
