# ================================
# Green Stack — Producción
# ================================
# Deploy: docker compose -p dermicapro-green -f docker-compose.prod-green.yml up -d
# El tráfico se controla via traefik/dynamic/production.yml (file provider)

services:
  backend-green:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: dermicapro-backend-green
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://dermicapro.app}
      # Protege GET /metrics; el mismo valor lo lee Prometheus.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Umbrales de las métricas de negocio. Tienen que declararse aquí: el
      # contenedor sólo ve lo que se le pasa, así que ponerlos en .env sin esto
      # no haría nada y el backend usaría siempre los valores por defecto.
      METRICS_STUCK_APPOINTMENT_HOURS: ${METRICS_STUCK_APPOINTMENT_HOURS:-6}
      METRICS_AGED_COMMISSION_DAYS: ${METRICS_AGED_COMMISSION_DAYS:-7}
      METRICS_OVER_PACKAGE_WINDOW_HOURS: ${METRICS_OVER_PACKAGE_WINDOW_HOURS:-24}
      METRICS_BUSINESS_INTERVAL_MS: ${METRICS_BUSINESS_INTERVAL_MS:-60000}
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dermicapro-prod-network
    logging:
      # json-file en lugar de splunk: Alloy lee los logs por la API de
      # Docker y los reenvia a Loki. Con el driver splunk `docker logs` no
      # devuelve nada y el contenedor se bloquea al arrancar si Splunk no
      # responde.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend-green:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: dermicapro-frontend-green
    restart: always
    depends_on:
      backend-green:
        condition: service_healthy
    environment:
      BACKEND_URL: http://dermicapro-backend-green:5000
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dermicapro-prod-network
      - traefik-network
    logging:
      # json-file en lugar de splunk: Alloy lee los logs por la API de
      # Docker y los reenvia a Loki. Con el driver splunk `docker logs` no
      # devuelve nada y el contenedor se bloquea al arrancar si Splunk no
      # responde.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  dermicapro-prod-network:
    external: true
    name: dermicapro-prod-network
  traefik-network:
    external: true
    name: traefik-network

volumes:
  backend_uploads:
    external: true
    name: dermicapro_backend_uploads
