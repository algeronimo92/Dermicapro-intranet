name: Docker CI/CD

on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main, qa]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ================================
  # Unit Tests — Backend
  # ================================
  unit-tests-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: dermicapro
          POSTGRES_PASSWORD: dermicapro123
          POSTGRES_DB: dermicapro_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://dermicapro:dermicapro123@localhost:5432/dermicapro_test
        run: npx prisma migrate deploy

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://dermicapro:dermicapro123@localhost:5432/dermicapro_test
          JWT_SECRET: test-secret-key
        run: npm run test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/coverage-final.json
          flags: backend

  # ================================
  # Unit Tests — Frontend
  # ================================
  unit-tests-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npm run test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend

  # ================================
  # Build Backend Docker Image
  # ================================
  build-backend:
    runs-on: ubuntu-latest
    needs: unit-tests-backend
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

  # ================================
  # Build Frontend Docker Image
  # ================================
  build-frontend:
    runs-on: ubuntu-latest
    needs: unit-tests-frontend
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

  # ================================
  # Security Scan
  # ================================
  security-scan:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute lowercase image names
        id: images
        run: |
          BASE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=${BASE}-backend:${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "frontend=${BASE}-frontend:${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.images.outputs.backend }}
          format: "sarif"
          output: "trivy-backend-results.sarif"

      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.images.outputs.frontend }}
          format: "sarif"
          output: "trivy-frontend-results.sarif"

      - name: Upload Trivy results (Backend) to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-backend-results.sarif"
          category: trivy-backend

      - name: Upload Trivy results (Frontend) to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-frontend-results.sarif"
          category: trivy-frontend

  # ================================
  # E2E Tests — Cypress (full stack)
  # ================================
  e2e-tests-cypress:
    runs-on: ubuntu-latest
    needs: [unit-tests-backend, unit-tests-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create .env for CI
        run: |
          cat > .env << EOF
          DATABASE_URL=postgresql://dermicapro:dermicapro123@db:5432/dermicapro_db
          JWT_SECRET=ci-test-secret-key
          NODE_ENV=development
          CORS_ORIGIN=http://localhost:5173
          EOF

      - name: Start full stack
        run: |
          for i in 1 2 3; do
            docker compose up -d --build && break
            echo "Attempt $i failed. Retrying in 30s..."
            sleep 30
          done

      - name: Wait for backend to be ready
        run: |
          timeout 90 bash -c \
            'until curl -sf http://localhost:5000/health 2>/dev/null; do
              echo "Waiting for backend..."; sleep 3
            done'

      - name: Wait for frontend to be ready
        run: |
          timeout 60 bash -c \
            'until curl -sf http://localhost:5173 2>/dev/null; do
              echo "Waiting for frontend..."; sleep 3
            done'

      - name: Run seed
        run: docker compose exec -T backend npm run prisma:seed

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v7
        with:
          working-directory: frontend
          config: baseUrl=http://localhost:5173
        env:
          CYPRESS_adminEmail: admin@dermicapro.com
          CYPRESS_adminPassword: admin123

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7

  # ================================
  # Deploy a producción
  # ================================
  # Vive dentro de este workflow, y no en uno propio encadenado con
  # `workflow_run`, para que `needs` garantice que el CI pasó. Con workflow_run
  # el job correría en el contexto de la rama por defecto: `github.sha` no sería
  # el commit validado y habría que rescatarlo de `workflow_run.head_sha`.
  #
  # security-scan queda fuera de `needs` a propósito: Trivy sube los resultados
  # a GitHub Security pero no falla por vulnerabilidades (no lleva exit-code),
  # así que como puerta no aporta nada y sólo añadiría un punto de fallo.
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, e2e-tests-cypress]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Dos deploys a la vez dejarían el blue-green en un estado indefinido.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Deploy blue-green a producción
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          envs: DEPLOY_SHA
          script: |
            set -e
            cd /docker/dermicapro-intranet

            # El clon del VPS es un espejo de origin/main, no un repo de
            # trabajo: aquí nunca se desarrolla. Por eso NO se usa `git pull`,
            # que intenta mezclar historias y aborta en cuanto el servidor se
            # desvía (por un merge, un commit suelto o un fichero editado a
            # mano). Se hace fetch + reset, que siempre converge.
            #
            # Nada se descarta en silencio: lo que haya en el servidor queda
            # guardado y anotado en este log, que es la única señal de que
            # alguien tocó producción a mano.
            git fetch origin main

            # 1. Cambios sin commitear -> stash, con el diff en el log.
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "::warning::Cambios sin commitear en el VPS; se apartan con stash"
              echo "----- ficheros modificados en el servidor -----"
              git status --short
              echo "----- diff completo -----"
              git diff
              echo "----------------------------------------------"
              git stash push -m "auto-stash deploy $(date -Iseconds)"
            fi

            git checkout main 2>/dev/null || git checkout -b main

            # Los workflows de distintos commits terminan el CI en un orden no
            # determinista. `concurrency` evita dos deploys simultáneos, pero no
            # impide que el job de un commit antiguo quede en cola y se ejecute
            # después de uno nuevo. Como esta rama queda apuntando al último
            # commit cuyo deploy se intentó, no permitimos moverla hacia atrás.
            CURRENT_SHA="$(git rev-parse HEAD)"
            if [ "$CURRENT_SHA" != "$DEPLOY_SHA" ] && \
               git merge-base --is-ancestor "$DEPLOY_SHA" "$CURRENT_SHA"; then
              echo "::notice::Deploy obsoleto omitido: $DEPLOY_SHA es anterior a $CURRENT_SHA"
              exit 0
            fi

            # 2. Commits locales que no están en GitHub -> rama de respaldo.
            #    Sin esto, el reset del paso 3 los borraría sin dejar rastro.
            if [ -n "$(git rev-list origin/main..HEAD)" ]; then
              BACKUP="vps-local-$(date +%Y%m%d-%H%M%S)"
              echo "::warning::Commits locales en el VPS; se guardan en la rama $BACKUP"
              git log --oneline origin/main..HEAD
              git branch "$BACKUP"
            fi

            # 3. Alinear con el commit exacto que validó el CI, no con la punta
            #    de main: si mientras corría el CI entró otro push, su código
            #    todavía no está verificado y no debe llegar a producción.
            #    Ese push lanzará su propio CI y su propio deploy.
            git reset --hard "$DEPLOY_SHA"

            bash scripts/deploy-prod.sh

      # Step aparte, y no un paso más dentro de deploy-prod.sh, porque
      # `make obs-up` aborta si faltan METRICS_TOKEN o DB_EXPORTER_PASSWORD en
      # el .env del VPS: dentro del script (con `set -e`) un problema de
      # monitoreo tumbaría el deploy de la aplicación. Separado, cada mitad se
      # ve en verde o rojo por su cuenta.
      - name: Desplegar stack de observabilidad
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            bash /docker/dermicapro-intranet/scripts/deploy-obs.sh
