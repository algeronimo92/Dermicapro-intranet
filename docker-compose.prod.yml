# ================================
# Production Configuration
# ================================
# Use this file for production deployments
# Command: docker compose -f docker-compose.prod.yml up -d

services:
  # ================================
  # PostgreSQL Database (Production)
  # ================================
  db:
    image: postgres:14-alpine
    container_name: dermicapro-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-dermicapro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dermicapro123}
      POSTGRES_DB: ${DB_NAME:-dermicapro_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dermicapro || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - dermicapro-network
    logging:
      # json-file en lugar de splunk: Alloy lee los logs por la API de
      # Docker y los reenvia a Loki. Con el driver splunk `docker logs` no
      # devuelve nada y el contenedor se bloquea al arrancar si Splunk no
      # responde.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ================================
  # Backend API (Production)
  # ================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: dermicapro-backend-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      # Protege GET /metrics; el mismo valor lo lee Prometheus.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Umbrales de las métricas de negocio. Tienen que declararse aquí: el
      # contenedor sólo ve lo que se le pasa, así que ponerlos en .env sin esto
      # no haría nada y el backend usaría siempre los valores por defecto.
      METRICS_STUCK_APPOINTMENT_HOURS: ${METRICS_STUCK_APPOINTMENT_HOURS:-6}
      METRICS_AGED_COMMISSION_DAYS: ${METRICS_AGED_COMMISSION_DAYS:-7}
      METRICS_OVER_PACKAGE_WINDOW_HOURS: ${METRICS_OVER_PACKAGE_WINDOW_HOURS:-24}
      METRICS_BUSINESS_INTERVAL_MS: ${METRICS_BUSINESS_INTERVAL_MS:-60000}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dermicapro-network
    logging:
      # json-file en lugar de splunk: Alloy lee los logs por la API de
      # Docker y los reenvia a Loki. Con el driver splunk `docker logs` no
      # devuelve nada y el contenedor se bloquea al arrancar si Splunk no
      # responde.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ================================
  # Frontend (Production)
  # ================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: dermicapro-frontend-prod
    restart: always
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.frontend.rule=Host(`dermicapro.app`) || Host(`www.dermicapro.app`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - dermicapro-network
      - traefik-network
    logging:
      # json-file en lugar de splunk: Alloy lee los logs por la API de
      # Docker y los reenvia a Loki. Con el driver splunk `docker logs` no
      # devuelve nada y el contenedor se bloquea al arrancar si Splunk no
      # responde.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

# ================================
# Networks
# ================================
networks:
  dermicapro-network:
    driver: bridge
  traefik-network:
    external: true
    name: traefik-network

# ================================
# Volumes
# ================================
volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
